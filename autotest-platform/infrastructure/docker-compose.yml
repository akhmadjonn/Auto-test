version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    volumes:
      - traefik-certs:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: traefik-config
        target: /etc/traefik/traefik.yml
    networks:
      - app-public

  # --- API: web server (no background services) ---
  api:
    image: ${REGISTRY:-autotest}-api:${TAG:-latest}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.avtolider.uz}`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.services.api.loadbalancer.server.port=8080"
        - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
    configs:
      - source: api-settings
        target: /settings.json
    secrets:
      - source: api-secrets
        target: /secrets.json
    depends_on:
      - redis
      - minio
    networks:
      - app-public
      - app-internal

  # --- Migrator: apply EF Core migrations and exit ---
  api-migrator:
    image: ${REGISTRY:-autotest}-api:${TAG:-latest}
    command: ["--apply-migrations"]
    healthcheck:
      test: ["NONE"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    configs:
      - source: api-settings
        target: /settings.json
    secrets:
      - source: api-secrets
        target: /secrets.json
    networks:
      - app-internal

  # --- Background: hosted services (session expiration, billing, token refresh) ---
  api-background:
    image: ${REGISTRY:-autotest}-api:${TAG:-latest}
    command: ["--background"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
    configs:
      - source: api-settings
        target: /settings.json
    secrets:
      - source: api-secrets
        target: /secrets.json
    depends_on:
      - redis
      - minio
    networks:
      - app-internal

  frontend:
    image: ${REGISTRY:-autotest}-frontend:${TAG:-latest}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_HOST:-avtolider.uz}`)"
        - "traefik.http.routers.frontend.entrypoints=websecure"
        - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
        - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - app-public

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
        if [ -f /run/secrets/redis-password ]; then
          REDIS_PASS=$$(cat /run/secrets/redis-password);
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASS";
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru;
        fi
      '
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    secrets:
      - redis-password
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-secret-key
    secrets:
      - minio-access-key
      - minio-secret-key
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-internal

networks:
  app-public:
    driver: overlay
  app-internal:
    driver: overlay
    internal: true

volumes:
  redisdata:
  miniodata:
  traefik-certs:

secrets:
  # App secrets — single JSON file with all credentials
  api-secrets:
    external: true
  # Infrastructure secrets — individual files for Redis/MinIO native _FILE support
  redis-password:
    external: true
  minio-access-key:
    external: true
  minio-secret-key:
    external: true

configs:
  traefik-config:
    file: ./traefik/traefik.yml
  api-settings:
    file: ./settings/prod.json
