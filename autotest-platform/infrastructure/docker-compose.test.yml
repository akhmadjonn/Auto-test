version: "3.8"

# Test environment override
# Usage: docker stack deploy -c docker-compose.yml -c docker-compose.test.yml autotest-test

services:
  api:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api-test.rule=Host(`${API_DOMAIN:-api-test.avtolider.uz}`)"
        - "traefik.http.routers.api-test.entrypoints=websecure"
        - "traefik.http.routers.api-test.tls.certresolver=letsencrypt"
        - "traefik.http.services.api-test.loadbalancer.server.port=8080"
        - "traefik.http.services.api-test.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.api-test.loadbalancer.healthcheck.interval=10s"
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:8080

  api-migrator:
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing

  api-background:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend-test.rule=Host(`${FRONTEND_HOST:-test.avtolider.uz}`)"
        - "traefik.http.routers.frontend-test.entrypoints=websecure"
        - "traefik.http.routers.frontend-test.tls.certresolver=letsencrypt"
        - "traefik.http.services.frontend-test.loadbalancer.server.port=3000"

configs:
  api-settings:
    file: ./settings/test.json
