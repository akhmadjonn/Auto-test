stages:
  - build
  - test
  - docker
  - deploy

variables:
  DOTNET_VERSION: "8.0"
  NODE_VERSION: "20"
  BACKEND_DIR: "backend"
  FRONTEND_DIR: "frontend"
  INFRA_DIR: "infrastructure"
  API_IMAGE: "${CI_REGISTRY_IMAGE}/api"
  FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/frontend"

# --- BUILD ---

build-backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - dotnet restore
    - dotnet publish src/AutoTest.Api/AutoTest.Api.csproj -c Release -o publish --no-restore
  artifacts:
    paths:
      - ${BACKEND_DIR}/publish/
    expire_in: 1 hour
  rules:
    - changes:
        - backend/**/*

build-frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - cd ${FRONTEND_DIR}
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ${FRONTEND_DIR}/.next/
      - ${FRONTEND_DIR}/public/
    expire_in: 1 hour
  rules:
    - changes:
        - frontend/**/*

# --- TEST ---

test-backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  script:
    - cd ${BACKEND_DIR}
    - dotnet restore
    - dotnet test --no-restore --verbosity normal
  rules:
    - changes:
        - backend/**/*

# --- DOCKER ---

docker-api:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t ${API_IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${API_IMAGE}:latest -f ${BACKEND_DIR}/Dockerfile ${BACKEND_DIR}/
    - docker push ${API_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${API_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

docker-frontend:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t ${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${FRONTEND_IMAGE}:latest -f ${FRONTEND_DIR}/Dockerfile ${FRONTEND_DIR}/
    - docker push ${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${FRONTEND_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- DEPLOY ---

deploy-test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - >
      ssh ${DEPLOY_USER:-deploy}@${DEPLOY_HOST_TEST}
      "cd /opt/autotest &&
      export REGISTRY=${CI_REGISTRY_IMAGE} &&
      export TAG=${CI_COMMIT_SHORT_SHA} &&
      docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
      docker stack deploy
      -c infrastructure/docker-compose.yml
      -c infrastructure/docker-compose.test.yml
      autotest-test --with-registry-auth &&
      docker stack services autotest-test"
  environment:
    name: test
    url: https://test.avtolider.uz
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

deploy-prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - >
      ssh ${DEPLOY_USER:-deploy}@${DEPLOY_HOST_PROD}
      "cd /opt/autotest &&
      export REGISTRY=${CI_REGISTRY_IMAGE} &&
      export TAG=${CI_COMMIT_SHORT_SHA} &&
      docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
      docker stack deploy
      -c infrastructure/docker-compose.yml
      autotest --with-registry-auth &&
      docker stack services autotest"
  environment:
    name: production
    url: https://avtolider.uz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
